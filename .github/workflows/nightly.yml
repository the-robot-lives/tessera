# tessera NIGHTLY lane — tiered CI (docs/notes/test-tiering.md)
#
# Slow, non-blocking-by-design coverage that must NOT gate per-change work:
#   - e2e-full: ALL Cypress hosts, including the currently-red-on-Linux
#     component-own-shadow legs (hologram_main a/c/d, tagged @slow), the
#     component gallery (:5588 — moved out of the fast gate, not core claim)
#     and the tier-2 static hosts (:5589).
#     continue-on-error + TODO(tessera-e2e-linux) — docs/notes/e2e-linux-ci.md.
#   - coverage: full ExUnit with --cover (library + persona_kit).
# The full ExUnit/WTR suites also run in the INTEGRATION lane (ci.yml) on every
# epic→develop merge; nightly re-runs coverage + the red e2e legs on a schedule.
# The weekly upstream-drift canary stays in canary.yml (scheduled + manual).
#
# A red nightly must still be triaged — it just never blocks a merge. No job
# here is a gate, and none uses `needs:` (skip-propagation house rule, ci.yml).

name: Nightly

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exunit-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.x"
          elixir-version: "1.18.x"

      - name: Restore deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'examples/persona_kit/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Library — FULL test + coverage
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix test --cover

      - name: persona_kit — FULL test
        working-directory: examples/persona_kit
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix test

  e2e-full:
    runs-on: ubuntu-latest
    # TODO(tessera-e2e-linux): drop continue-on-error once the Linux failure
    # mode is fixed — docs/notes/e2e-linux-ci.md (component-own shadow updates
    # are lost under the Hologram host on ubuntu runners while all specs pass
    # on macOS; toolchain + Linux browser both ruled out). The @slow legs
    # (hologram_main a/c/d) are the known-red ones; @fast legs pass here too.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install inotify-tools (file_system / LiveReload)
        run: sudo apt-get update && sudo apt-get install -y inotify-tools

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.x"
          elixir-version: "1.18.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Boot Hologram demo on :5586
        working-directory: demo/hologram_app
        run: |
          export HOLOGRAM_START=1
          mix deps.get
          mix tessera.install
          # tessera.bundles shells out to Hologram's own esbuild — install its
          # assets first (no lockfile in the hex tarball → npm install).
          npm install --prefix deps/hologram/assets --no-audit --no-fund
          # Tier-2 serving bundles (the /holo_runtime glue imports them from
          # /tessera/) — same emit step as the fast lane, before boot.
          mix tessera.bundles
          # Regenerate spike_kit's gitignored *.element.generated.mjs (a warm
          # _build cache skips the compile that writes them; see ci.yml).
          mix deps.clean spike_kit --build && mix compile
          nohup mix holo > /tmp/holo.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:5586/ && exit 0
            sleep 2
          done
          echo "::error::Hologram demo did not come up on :5586"; tail -50 /tmp/holo.log; exit 1

      - name: Install persona_kit npm deps (lit resolves from importer path)
        working-directory: examples/persona_kit
        run: npm ci

      # The @slow spike_lit spec exercises the elixir-to-lit spike's UMD/ESM/
      # React hosts, whose bundles are built by spike_kit and copied into
      # demo/plain_html/dist. Generate the element modules (mix compile) then
      # build the bundles before the plain demo serves them.
      - name: Build spike bundles (spike_kit → plain_html/dist)
        working-directory: examples/spike_kit
        run: |
          npm ci
          mix deps.get
          mix compile
          npm run build:bundles

      - name: Boot plain-HTML demo on :5587
        working-directory: demo/plain_html
        run: |
          npm install
          npm run build
          nohup npm run serve > /tmp/plain.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5587/ && exit 0
            sleep 1
          done
          echo "::error::plain demo did not come up on :5587"; tail -20 /tmp/plain.log; exit 1

      # The component gallery (mix tessera.gen.gallery) moved OUT of the fast
      # gate (not part of the core claim) — its coverage lives here. The
      # component .mjs import their contract.generated.mjs siblings, so
      # persona_kit must be compiled first; esbuild resolves the components'
      # bare imports from persona_kit's node_modules (installed above).
      - name: Boot component gallery on :5588
        run: |
          (cd examples/persona_kit && mix deps.get && mix compile)
          cd examples/persona_kit/gallery
          npm ci --no-audit --no-fund
          npm run build
          nohup npm run serve > /tmp/gallery.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5588/ && exit 0
            sleep 1
          done
          echo "::error::gallery did not come up on :5588"; tail -20 /tmp/gallery.log; exit 1

      # Tier-2 static hosts (holo_runtime_element.cy.ts, untagged → full suite
      # only): plain HTML + React on :5589, served from demo/holo_element with
      # the UMD bundles emitted by `mix tessera.bundles` (one compile emits
      # esm + umd + standalone) copied into dist/tessera-holo.
      - name: Boot tier-2 static hosts on :5589
        run: |
          mkdir -p demo/holo_element/dist/tessera-holo
          cp demo/hologram_app/priv/static/tessera/*.js demo/holo_element/dist/tessera-holo/
          # SSR/DSD page (ssr_dsd.cy.ts): re-render from the CURRENT sources so
          # the committed page can't drift from Render / the Counter template.
          (cd demo/hologram_app && mix run --no-start priv/gen_ssr_page.exs)
          (cd demo/holo_element/react/vendor && npm ci --no-audit --no-fund)
          cd demo/holo_element
          nohup node serve.mjs > /tmp/holo-element.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5589/plain/ && exit 0
            sleep 1
          done
          echo "::error::holo_element hosts did not come up on :5589"; tail -20 /tmp/holo-element.log; exit 1

      - name: "Cypress FULL suite (all hosts; @slow Linux legs non-blocking)"
        working-directory: demo/e2e
        run: |
          npm ci
          npm test

      - name: Upload cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-full
          path: demo/e2e/cypress/screenshots
          if-no-files-found: ignore