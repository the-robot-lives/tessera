# tessera CI — Phase 1 MVP
#
# Jobs:
#   exunit — format check, warnings-as-errors compile, ExUnit for the library
#            and the persona_kit example package
#   js     — @noizu/tessera-core WTR suite (incl. the assert-no-lit guard)
#            + persona_kit component WTR suite
#   e2e    — boots the Hologram demo (:5586) and the plain-HTML demo (:5587),
#            then runs the Cypress suite; continue-on-error while the boot
#            recipe stabilises on CI runners (TODO: make blocking once green
#            for a full cycle)
#
# Elixir 1.18.x / OTP 27: hologram 0.10.1 supports ~> 1.15; 1.18 avoids the
# Elixir 1.20+ "redundant init/3 clause" type warning that would fail the
# --warnings-as-errors compile.

name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.x"
          elixir-version: "1.18.x"

      - name: Restore deps + build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('mix.lock', 'examples/persona_kit/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Library — format, compile, test
        run: |
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test

      - name: persona_kit — format, compile, test
        working-directory: examples/persona_kit
        run: |
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache js core node_modules
        uses: actions/cache@v4
        with:
          path: js/node_modules
          key: js-${{ runner.os }}-${{ hashFiles('js/package-lock.json') }}

      - name: tessera-core WTR suite (incl. assert-no-lit)
        working-directory: js
        run: npm ci && npm test

      - name: Cache persona_kit node_modules
        uses: actions/cache@v4
        with:
          path: examples/persona_kit/node_modules
          key: pk-js-${{ runner.os }}-${{ hashFiles('examples/persona_kit/package-lock.json') }}

      - name: persona_kit WTR suite
        working-directory: examples/persona_kit
        run: npm ci && npm test

  e2e:
    runs-on: ubuntu-latest
    # TODO: drop continue-on-error once this job has been green for a full
    # release cycle — until then a red e2e must still be triaged, it just
    # does not block.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.x"
          elixir-version: "1.18.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Boot Hologram demo on :5586
        working-directory: demo/hologram_app
        run: |
          mix deps.get
          mix tessera.install
          nohup mix holo > /tmp/holo.log 2>&1 &
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://localhost:5586/ && exit 0
            sleep 2
          done
          echo "::error::Hologram demo did not come up on :5586"; tail -50 /tmp/holo.log; exit 1

      - name: Boot plain-HTML demo on :5587
        working-directory: demo/plain_html
        run: |
          npm install
          npm run build
          nohup npm run serve > /tmp/plain.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5587/ && exit 0
            sleep 1
          done
          echo "::error::plain demo did not come up on :5587"; tail -20 /tmp/plain.log; exit 1

      - name: Cypress suite
        working-directory: demo/e2e
        run: |
          npm ci
          npx cypress run --spec "src/e2e/*.cy.ts"

      - name: Upload cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: demo/e2e/cypress/screenshots
          if-no-files-found: ignore
